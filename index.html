<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatCraft AI - HipHop & Sad AI Song Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0f17;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #16192b;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a2f4c;
            text-align: center;
        }
        h1 {
            color: #00f2fe;
            font-size: 28px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        p.subtitle {
            color: #a0a5c0;
            font-size: 14px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 110px;
            background: #0d0f17;
            border: 1px solid #2a2f4c;
            border-radius: 12px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            resize: none;
            outline: none;
            margin-bottom: 15px;
        }
        textarea:focus {
            border-color: #00f2fe;
        }
        label {
            display: block;
            text-align: left;
            font-size: 13px;
            color: #a0a5c0;
            margin-bottom: 5px;
            margin-top: 10px;
        }
        select {
            width: 100%;
            padding: 12px;
            background: #0d0f17;
            border: 1px solid #2a2f4c;
            color: #fff;
            border-radius: 12px;
            outline: none;
            margin-bottom: 10px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: #000;
            margin-top: 15px;
        }
        button:disabled {
            background: #4a506b;
            color: #888;
            cursor: not-allowed;
        }
        .btn-reset {
            background: #2a2f4c;
            color: #00f2fe;
            margin-top: 10px;
            display: none;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #00f2fe;
            word-wrap: break-word;
        }
        audio {
            width: 100%;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BeatCraft AI</h1>
    <p class="subtitle">Real AI Vocals & Music Studio</p>

    <textarea id="lyricsInput" placeholder="Yahan lyrics likho..."></textarea>

    <label for="genreSelect">🎶 Song Type (Gana kaisa chahiye):</label>
    <select id="genreSelect">
        <option value="aggressive hiphop rap track with high beat">🔥 Hip-Hop / Rap</option>
        <option value="emotional slow acoustic sad song with deep vocals">💔 Sad Song</option>
    </select>

    <label for="langSelect">🗣️ Language (Bhasha select karein):</label>
    <select id="langSelect">
        <option value="Hindi">🇮🇳 Hindi</option>
        <option value="Hinglish">🎤 Hinglish (Hindi + English Mix)</option>
        <option value="English">🇬🇧 English</option>
        <option value="Bhojpuri">🌾 Bhojpuri</option>
    </select>

    <button id="generateBtn" onclick="generateAISong()">GENERATE AI SONG 🎤</button>
    <button id="resetBtn" class="btn-reset" onclick="resetApp()">🔄 Create Another Song</button>

    <div id="statusText" class="status"></div>
    <audio id="audioPlayer" controls></audio>
</div>

<script>
    // Aapki Hugging Face API Key
    const API_KEY = "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"; 

    async function generateAISong() {
        const lyrics = document.getElementById('lyricsInput').value.trim();
        const genre = document.getElementById('genreSelect').value;
        const lang = document.getElementById('langSelect').value;

        const generateBtn = document.getElementById('generateBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusText = document.getElementById('statusText');
        const audioPlayer = document.getElementById('audioPlayer');

        if (!lyrics) {
            alert('Bhai pehle lyrics toh daalo!');
            return;
        }

        generateBtn.disabled = true;
        generateBtn.innerText = 'AI Singer Processing... 🎤';
        statusText.innerText = 'Generating track... (It takes 15-30 seconds)';

        // Combine Genre, Language, and Lyrics for AI prompt
        const fullPrompt = `[Style: ${genre}] [Language: ${lang}] ${lyrics}`;

        try {
            const response = await fetch("https://api-inference.huggingface.co/models/suno/bark-small", {
                headers: { 
                    Authorization: `Bearer ${API_KEY}`,
                    "Content-Type": "application/json"
                },
                method: "POST",
                body: JSON.stringify({ inputs: fullPrompt }),
            });

            if (!response.ok) {
                if (response.status === 503) {
                    throw new Error("AI Model load ho raha hai... 15 sec baad phir TRY AGAIN dabayein.");
                } else {
                    throw new Error("API Limit or Server busy. Please try again.");
                }
            }

            const blob = await response.blob();
            const audioUrl = URL.createObjectURL(blob);

            audioPlayer.src = audioUrl;
            audioPlayer.style.display = "block";
            audioPlayer.play();

            statusText.innerText = "Song Ready! Tap play below 🔥";
            generateBtn.innerText = "SONG CREATED!";
            resetBtn.style.display = "block";

        } catch (error) {
            console.error(error);
            statusText.innerText = "Error: " + error.message;
            generateBtn.innerText = "TRY AGAIN";
            generateBtn.disabled = false;
        }
    }

    function resetApp() {
        document.getElementById('lyricsInput').value = '';
        const audioPlayer = document.getElementById('audioPlayer');
        
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        audioPlayer.style.display = 'none';

        const generateBtn = document.getElementById('generateBtn');
        generateBtn.disabled = false;
        generateBtn.innerText = 'GENERATE AI SONG 🎤';

        document.getElementById('statusText').innerText = '';
        document.getElementById('resetBtn').style.display = 'none';
    }
</script>

</body>
</html>
