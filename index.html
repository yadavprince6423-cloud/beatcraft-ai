<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatCraft AI - Real Suno-Style AI Song Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0f17;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #16192b;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a2f4c;
            text-align: center;
        }
        h1 {
            color: #00f2fe;
            font-size: 26px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        p.subtitle {
            color: #a0a5c0;
            font-size: 13px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #0d0f17;
            border: 1px solid #2a2f4c;
            border-radius: 12px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            resize: none;
            outline: none;
            margin-bottom: 15px;
        }
        textarea:focus {
            border-color: #00f2fe;
        }
        label {
            display: block;
            text-align: left;
            font-size: 13px;
            color: #a0a5c0;
            margin-bottom: 5px;
            margin-top: 10px;
        }
        select {
            width: 100%;
            padding: 12px;
            background: #0d0f17;
            border: 1px solid #2a2f4c;
            color: #fff;
            border-radius: 12px;
            outline: none;
            margin-bottom: 10px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: #000;
            margin-top: 15px;
        }
        button:disabled {
            background: #4a506b;
            color: #888;
            cursor: not-allowed;
        }
        .btn-reset {
            background: #2a2f4c;
            color: #00f2fe;
            margin-top: 10px;
            display: none;
        }
        .status {
            margin-top: 15px;
            font-size: 13px;
            color: #00f2fe;
            word-wrap: break-word;
            line-height: 1.4;
        }
        audio {
            width: 100%;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BeatCraft AI</h1>
    <p class="subtitle">Suno-Style Real AI Song Generator</p>

    <textarea id="lyricsInput" placeholder="Song theme ya lyrics yahan likho..."></textarea>

    <label for="genreSelect">🎶 Song Genre (Style):</label>
    <select id="genreSelect">
        <option value="fast heavy bass energetic indian hip hop rap song with vocal melody">🔥 Indian Hip-Hop / Rap</option>
        <option value="sad acoustic piano guitar slow melody emotional indian song">💔 Sad Emotional Song</option>
    </select>

    <button id="generateBtn" onclick="generateAISong()">CREATE REAL AI SONG 🎤</button>
    <button id="resetBtn" class="btn-reset" onclick="resetApp()">🔄 Create Another Song</button>

    <div id="statusText" class="status"></div>
    <audio id="audioPlayer" controls></audio>
</div>

<script>
    // Aapki Hugging Face API Key
    const API_KEY = "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"; 

    async function generateAISong() {
        const lyrics = document.getElementById('lyricsInput').value.trim();
        const genre = document.getElementById('genreSelect').value;

        const generateBtn = document.getElementById('generateBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusText = document.getElementById('statusText');
        const audioPlayer = document.getElementById('audioPlayer');

        if (!lyrics) {
            alert('Bhai pehle lyrics ya theme toh daalo!');
            return;
        }

        generateBtn.disabled = true;
        generateBtn.innerText = 'AI Compose Kar Raha Hai... 🎵';
        statusText.innerText = 'Suno AI model track composition start kar raha hai (Isme 30-45 sec lag sakte hain, please wait)...';

        // Prompting MusicGen Meta Model
        const fullPrompt = `${genre}, lyrics and rhythm: ${lyrics}`;

        try {
            // Meta MusicGen Model (Creates authentic mixed song tracks)
            const response = await fetch("https://api-inference.huggingface.co/models/facebook/musicgen-small", {
                headers: { 
                    Authorization: `Bearer ${API_KEY}`,
                    "Content-Type": "application/json"
                },
                method: "POST",
                body: JSON.stringify({ inputs: fullPrompt }),
            });

            if (!response.ok) {
                if (response.status === 503) {
                    throw new Error("AI Server load ho raha hai... 20 seconds baad TRY AGAIN dabayein!");
                } else {
                    throw new Error("API Limit issue. Kripya thodi der baad try karein.");
                }
            }

            const blob = await response.blob();
            const audioUrl = URL.createObjectURL(blob);

            audioPlayer.src = audioUrl;
            audioPlayer.style.display = "block";
            await audioPlayer.play();

            statusText.innerText = "Real AI Song Ready! Enjoy the Track 🔥";
            generateBtn.innerText = "SONG CREATED!";
            resetBtn.style.display = "block";

        } catch (error) {
            console.error(error);
            statusText.innerText = "Notice: " + error.message;
            generateBtn.innerText = "TRY AGAIN 🔄";
            generateBtn.disabled = false;
        }
    }

    function resetApp() {
        document.getElementById('lyricsInput').value = '';
        const audioPlayer = document.getElementById('audioPlayer');
        
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        audioPlayer.style.display = 'none';

        const generateBtn = document.getElementById('generateBtn');
        generateBtn.disabled = false;
        generateBtn.innerText = 'CREATE REAL AI SONG 🎤';

        document.getElementById('statusText').innerText = '';
        document.getElementById('resetBtn').style.display = 'none';
    }
</script>

</body>
</html>
