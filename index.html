<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatCraft AI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        textarea, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .audio-player { margin-top: 25px; }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>BeatCraft AI 🎧</h1>
    <p>AI Lyrics Vocal & Free Beat Generator</p>

    <textarea id="prompt" rows="4" placeholder="Write your lyrics or song prompt here..."></textarea>
    
    <select id="genre">
        <option value="hiphop">🔥 Hip-Hop / Rap Beat</option>
        <option value="lofi">☕ Lo-Fi Chill Beat</option>
        <option value="edm">⚡ EDM Festival Beat</option>
    </select>

    <button onclick="generateSong()">🎵 GENERATE FULL SONG</button>

    <div class="audio-player" id="playerBox" style="display:none;">
        <p style="color: #4ade80;">✨ Beat & Vocals Playing!</p>
        <audio id="audio" controls loop></audio>
    </div>
</div>

<script>
    function generateSong() {
        const lyrics = document.getElementById('prompt').value;
        const btn = document.querySelector('button');
        const playerBox = document.getElementById('playerBox');
        const audio = document.getElementById('audio');

        if (!lyrics.trim()) {
            alert("Pehle lyrics ya prompt toh daalo bhai!");
            return;
        }

        btn.innerText = "⚡ Creating Song...";
        btn.disabled = true;

        setTimeout(() => {
            const beats = [
                "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3",
                "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3",
                "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3"
            ];
            const randomBeat = beats[Math.floor(Math.random() * beats.length)];
            
            audio.src = randomBeat;
            playerBox.style.display = "block";
            audio.play();

            // AI Speech (Lyrics Vocal)
            window.speechSynthesis.cancel(); // Reset previous speech
            const speech = new SpeechSynthesisUtterance(lyrics);
            speech.rate = 1.0;  // Speed
            speech.pitch = 1.1; // Voice Pitch
            speech.lang = 'hi-IN'; // Hindi/English blend accent
            
            window.speechSynthesis.speak(speech);

            btn.innerText = "🎵 GENERATE FULL SONG";
            btn.disabled = false;
        }, 1200);
    }
</script>

</body>
</html>
