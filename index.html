<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatCraft AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0f17;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #16192b;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a2f4c;
            text-align: center;
        }
        h1 {
            color: #00f2fe;
            font-size: 28px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        p.subtitle {
            color: #a0a5c0;
            font-size: 14px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            background: #0d0f17;
            border: 1px solid #2a2f4c;
            border-radius: 12px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            resize: none;
            outline: none;
            margin-bottom: 15px;
        }
        textarea:focus {
            border-color: #00f2fe;
        }
        select {
            width: 100%;
            padding: 12px;
            background: #0d0f17;
            border: 1px solid #2a2f4c;
            color: #fff;
            border-radius: 12px;
            outline: none;
            margin-bottom: 20px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-generate {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: #000;
        }
        .btn-generate:disabled {
            background: #4a506b;
            color: #888;
            cursor: not-allowed;
        }
        .btn-reset {
            background: #2a2f4c;
            color: #00f2fe;
            margin-top: 10px;
            display: none;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #a0a5c0;
        }
        audio {
            width: 100%;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BeatCraft AI</h1>
    <p class="subtitle">Create AI Songs & Beats Instantly</p>

    <textarea id="lyricsInput" placeholder="Paste your song lyrics here..."></textarea>

    <select id="genreSelect">
        <option value="Hip-Hop / Rap">🔥 Hip-Hop / Rap</option>
        <option value="Lo-Fi Chill">☕ Lo-Fi Chill Beat</option>
        <option value="Aggressive Trap">⚡ Aggressive Trap</option>
        <option value="Romantic Melodic">❤️ Romantic Melodic</option>
    </select>

    <button id="generateBtn" class="btn-generate" onclick="generateSong()">GENERATE FULL SONG</button>
    <button id="resetBtn" class="btn-reset" onclick="resetApp()">🔄 Create Another Song</button>

    <div id="statusText" class="status"></div>
    <audio id="audioPlayer" controls></audio>
</div>

<script>
    function generateSong() {
        const lyrics = document.getElementById('lyricsInput').value.trim();
        const generateBtn = document.getElementById('generateBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusText = document.getElementById('statusText');
        const audioPlayer = document.getElementById('audioPlayer');

        if (!lyrics) {
            alert('Bhai pehle gana/lyrics toh daalo!');
            return;
        }

        // Processing UI
        generateBtn.disabled = true;
        generateBtn.innerText = 'Creating Beat & Music... 🎵';
        statusText.innerText = 'Generating track, please wait...';

        // Demo Audio Flow (Simulating Creation)
        setTimeout(() => {
            statusText.innerText = 'Song Ready! Tap play below 🔥';
            generateBtn.innerText = 'SONG CREATED!';
            
            // Sample Demo Music Track
            audioPlayer.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
            audioPlayer.style.display = 'block';
            audioPlayer.play();

            // Show Reset Button to allow creating another song
            resetBtn.style.display = 'block';
        }, 3000);
    }

    function resetApp() {
        document.getElementById('lyricsInput').value = '';
        const audioPlayer = document.getElementById('audioPlayer');
        
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        audioPlayer.style.display = 'none';

        const generateBtn = document.getElementById('generateBtn');
        generateBtn.disabled = false;
        generateBtn.innerText = 'GENERATE FULL SONG';

        document.getElementById('statusText').innerText = '';
        document.getElementById('resetBtn').style.display = 'none';
    }
</script>

</body>
</html>
