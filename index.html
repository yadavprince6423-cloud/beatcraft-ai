<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatCraft AI - Real Beat & Vocal Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0f17;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #16192b;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a2f4c;
            text-align: center;
        }
        h1 {
            color: #00f2fe;
            font-size: 28px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        p.subtitle {
            color: #a0a5c0;
            font-size: 14px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 110px;
            background: #0d0f17;
            border: 1px solid #2a2f4c;
            border-radius: 12px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            resize: none;
            outline: none;
            margin-bottom: 15px;
        }
        textarea:focus {
            border-color: #00f2fe;
        }
        label {
            display: block;
            text-align: left;
            font-size: 13px;
            color: #a0a5c0;
            margin-bottom: 5px;
            margin-top: 10px;
        }
        select {
            width: 100%;
            padding: 12px;
            background: #0d0f17;
            border: 1px solid #2a2f4c;
            color: #fff;
            border-radius: 12px;
            outline: none;
            margin-bottom: 10px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: #000;
            margin-top: 15px;
        }
        button:disabled {
            background: #4a506b;
            color: #888;
            cursor: not-allowed;
        }
        .btn-reset {
            background: #2a2f4c;
            color: #00f2fe;
            margin-top: 10px;
            display: none;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #00f2fe;
            word-wrap: break-word;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        .audio-box {
            margin-top: 15px;
            display: none;
            background: #0d0f17;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #2a2f4c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BeatCraft AI</h1>
    <p class="subtitle">Real AI Vocals & Music Studio</p>

    <textarea id="lyricsInput" placeholder="Yahan lyrics likho..."></textarea>

    <label for="genreSelect">🎶 Song Type (Gana kaisa chahiye):</label>
    <select id="genreSelect">
        <option value="hiphop">🔥 Hip-Hop / Rap Beat</option>
        <option value="sad">💔 Sad Emotional Music</option>
    </select>

    <label for="langSelect">🗣️ Language (Bhasha select karein):</label>
    <select id="langSelect">
        <option value="hi">🇮🇳 Hindi</option>
        <option value="en">🇬🇧 English</option>
    </select>

    <button id="generateBtn" onclick="generateAISong()">GENERATE AI SONG WITH MUSIC 🎤</button>
    <button id="resetBtn" class="btn-reset" onclick="resetApp()">🔄 Create Another Song</button>

    <div id="statusText" class="status"></div>

    <div id="audioBox" class="audio-box">
        <label>🎤 Vocals (Aawaaz):</label>
        <audio id="vocalPlayer" controls></audio>
        
        <label>🥁 Background Music (Beat):</label>
        <audio id="beatPlayer" controls loop></audio>
    </div>
</div>

<script>
    // Free Royalty-Free Background Beats Links
    const beats = {
        hiphop: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
        sad: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
    };

    async function generateAISong() {
        const lyrics = document.getElementById('lyricsInput').value.trim();
        const lang = document.getElementById('langSelect').value;
        const genre = document.getElementById('genreSelect').value;

        const generateBtn = document.getElementById('generateBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusText = document.getElementById('statusText');
        const vocalPlayer = document.getElementById('vocalPlayer');
        const beatPlayer = document.getElementById('beatPlayer');
        const audioBox = document.getElementById('audioBox');

        if (!lyrics) {
            alert('Bhai pehle lyrics toh daalo!');
            return;
        }

        generateBtn.disabled = true;
        generateBtn.innerText = 'Mixing Vocals & Beat... 🎤';
        statusText.innerText = 'Generating full song track...';

        try {
            const cleanText = lyrics.replace(/\(Verse \d+\)/gi, '').replace(/\(Chorus\)/gi, '').trim();
            const encodedText = encodeURIComponent(cleanText);
            
            // Vocal Audio Link
            const vocalUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=${lang}&client=tw-ob`;

            vocalPlayer.src = vocalUrl;
            beatPlayer.src = beats[genre];

            audioBox.style.display = "block";

            // Play both together
            beatPlayer.volume = 0.4; // Beat volume thodi halki rakhi hai taaki vocals saaf sune
            vocalPlayer.volume = 1.0;

            await beatPlayer.play();
            await vocalPlayer.play();

            statusText.innerText = "Song & Music Playing Together! 🔥";
            generateBtn.innerText = "SONG CREATED!";
            resetBtn.style.display = "block";

        } catch (error) {
            console.error(error);
            statusText.innerText = "Tap play button on players below to listen!";
            generateBtn.innerText = "TRY AGAIN";
            generateBtn.disabled = false;
        }
    }

    function resetApp() {
        document.getElementById('lyricsInput').value = '';
        const vocalPlayer = document.getElementById('vocalPlayer');
        const beatPlayer = document.getElementById('beatPlayer');
        
        vocalPlayer.pause();
        beatPlayer.pause();
        
        document.getElementById('audioBox').style.display = 'none';

        const generateBtn = document.getElementById('generateBtn');
        generateBtn.disabled = false;
        generateBtn.innerText = 'GENERATE AI SONG WITH MUSIC 🎤';

        document.getElementById('statusText').innerText = '';
        document.getElementById('resetBtn').style.display = 'none';
    }
</script>

</body>
</html>
